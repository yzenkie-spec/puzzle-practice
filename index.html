<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF3FF;--card:#FFFFFF;--ink:#1F2A44;--mute:#56627F;--ok:#1E8E5A;--okbg:#DFF5E8;--no:#C2410C;--nobg:#FFE9DD;--line:#C9D8F0;--brand:#3B6FE0;--on-brand:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141B2D;--card:#1E2842;--ink:#EEF2FF;--mute:#A6B1CF;--ok:#6FE0A4;--okbg:#17382B;--no:#FFB38A;--nobg:#3A2518;--line:#33406A;--brand:#7FA2FF;--on-brand:#141B2D}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141B2D;--card:#1E2842;--ink:#EEF2FF;--mute:#A6B1CF;--ok:#6FE0A4;--okbg:#17382B;--no:#FFB38A;--nobg:#3A2518;--line:#33406A;--brand:#7FA2FF;--on-brand:#141B2D}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 20px/1.5 Nunito,"Trebuchet MS",system-ui,sans-serif}
#app{max-width:820px;margin:0 auto;padding:24px 20px 56px}
h1,h2,.m b,.q,.seq,.opt,.go{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif}
h1{font-size:40px;line-height:1.1;margin:8px 0}
h2{font-size:26px;margin:28px 0 12px}
.sub{color:var(--mute);margin:0 0 16px}
.badges{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 20px}
.badges span{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:800}
.menu{display:grid;gap:14px;margin:0 0 20px}
.m{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:18px 22px;font:inherit;cursor:pointer;min-height:76px}
.m b{font-size:25px;font-weight:700;display:block}
.m small{color:var(--mute);font-size:17px}
.ghost{background:none;border:2px solid var(--line);color:var(--ink);border-radius:14px;padding:10px 18px;font:inherit;min-height:48px;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:16px}
.q{font-size:28px;line-height:1.3;font-weight:700;margin:0}
.seq{font-size:40px;line-height:1.4;font-weight:700;margin:10px 0 0;letter-spacing:.06em;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{min-height:76px;font-size:30px;font-weight:700;background:var(--card);border:3px solid var(--line);border-radius:18px;color:var(--ink);cursor:pointer;padding:12px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt.pick{border-color:var(--brand)}
.fb{border-radius:16px;padding:16px 20px;margin:18px 0 12px;background:var(--card);border:2px solid var(--line);border-left-width:8px}
.fb.good{border-left-color:var(--ok)}
.fb.bad{border-left-color:var(--no)}
.go{background:var(--brand);color:var(--on-brand);border:0;border-radius:16px;font-size:24px;font-weight:700;padding:16px 28px;min-height:64px;cursor:pointer;width:100%}
.rev p{margin:4px 0}
:focus-visible{outline:4px solid var(--brand);outline-offset:3px}
@media (max-width:520px){.opts{grid-template-columns:1fr}h1{font-size:32px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const B=[
["v","Bird is to nest as bee is to…",["hive","hole","tree","flower"],0,"A bird lives in a nest. A bee lives in a hive."],
["v","Hot is to cold as up is to…",["high","down","over","sky"],1,"Hot and cold are opposites. The opposite of up is down."],
["v","Finger is to hand as toe is to…",["shoe","foot","leg","sock"],1,"A finger is part of a hand. A toe is part of a foot."],
["v","Pen is to write as scissors are to…",["paper","cut","sharp","draw"],1,"A pen is used to write. Scissors are used to cut."],
["v","Puppy is to dog as kitten is to…",["cat","mouse","milk","paw"],0,"A puppy is a baby dog. A kitten is a baby cat."],
["v","Which word does not belong?\napple, banana, carrot, grape",["apple","banana","carrot","grape"],2,"Apples, bananas and grapes are fruits. A carrot is a vegetable."],
["v","Which word does not belong?\nhammer, saw, screwdriver, pillow",["hammer","saw","screwdriver","pillow"],3,"Hammers, saws and screwdrivers are tools. A pillow is not."],
["v","Which word does not belong?\nMonday, Friday, July, Sunday",["Monday","Friday","July","Sunday"],2,"Monday, Friday and Sunday are days. July is a month."],
["v","Which word does not belong?\nsquare, circle, triangle, blue",["square","circle","triangle","blue"],3,"Square, circle and triangle are shapes. Blue is a colour."],
["v","Which word means the same as happy?",["glad","tired","angry","slow"],0,"Glad and happy mean almost the same thing."],
["v","Which word is the opposite of ancient?",["old","modern","tiny","quiet"],1,"Ancient means very old. Modern means new."],
["n","What comes next?\n2, 4, 6, 8, ?",["9","10","12","14"],1,"The numbers go up by 2 each time. 8 + 2 = 10."],
["n","What comes next?\n5, 10, 15, 20, ?",["22","25","30","35"],1,"The numbers go up by 5. 20 + 5 = 25."],
["n","What comes next?\n1, 2, 4, 8, ?",["10","12","14","16"],3,"Each number is double the one before. 8 × 2 = 16."],
["n","What comes next?\n20, 17, 14, 11, ?",["10","9","8","7"],2,"The numbers go down by 3. 11 − 3 = 8."],
["n","What number is missing?\n3, 6, 9, ?, 15",["10","11","12","13"],2,"The numbers go up by 3. 9 + 3 = 12."],
["n","What comes next?\n1, 3, 6, 10, ?",["13","14","15","16"],2,"The jumps get bigger: +2, +3, +4. The next jump is +5, so 10 + 5 = 15."],
["n","What number goes in the box?\n7 + ☐ = 15",["6","7","8","9"],2,"15 − 7 = 8, so 7 + 8 = 15."],
["n","Which answer is the greatest?",["3 × 4","2 × 5","20 ÷ 2","15 − 4"],0,"3 × 4 = 12, 2 × 5 = 10, 20 ÷ 2 = 10 and 15 − 4 = 11. So 12 is the greatest."],
["n","Sam has 12 stickers. He gives 3 stickers to each of 2 friends. How many stickers are left?",["3","6","9","4"],1,"3 + 3 = 6 stickers given away. 12 − 6 = 6 left."],
["n","What is half of 18?",["8","9","10","6"],1,"Half means 2 equal groups. 9 + 9 = 18."],
["n","A pencil costs 5¢. How many pencils can you buy with 30¢?",["5","6","7","35"],1,"30 ÷ 5 = 6 pencils."],
["n","Which number is the odd one out?\n12, 18, 25, 30",["12","18","25","30"],2,"12, 18 and 30 are even numbers. 25 is odd."],
["s","What comes next?\n🔴 🔵 🔴 🔵 🔴 ?",["🔴","🔵","🟡","🟢"],1,"Red and blue take turns. After red comes blue."],
["s","What comes next?\n⬛ ⬛ ⬜ ⬛ ⬛ ⬜ ⬛ ⬛ ?",["⬛","⬜","🟦","🟨"],1,"The pattern is two black squares, then one white. Two blacks are done, so white is next."],
["s","What comes next?\n▲ ● ■ ▲ ● ■ ▲ ?",["▲","●","■","★"],1,"The pattern ▲ ● ■ repeats. After ▲ comes ●."],
["s","What comes next?\n⭐ 🌙 ⭐⭐ 🌙 ⭐⭐⭐ 🌙 ?",["⭐","⭐⭐","⭐⭐⭐","⭐⭐⭐⭐"],3,"There is one more star each time: 1, 2, 3. So 4 stars come next."],
["s","What comes next?\n⬆️ ➡️ ⬇️ ⬅️ ⬆️ ➡️ ?",["⬆️","⬇️","⬅️","➡️"],1,"The arrow turns a quarter turn each time. After ➡️ comes ⬇️."],
["s","Which one is different?\n🔺 🔺 🔻 🔺",["The 1st one","The 2nd one","The 3rd one","The 4th one"],2,"The 3rd triangle points down. The others point up."],
["s","How many sides does a hexagon have?",["5","6","7","8"],1,"A hexagon has 6 sides."],
["s","What comes next?\n🌑 🌓 🌕 🌓 ?",["🌑","🌕","🌓","🌒"],0,"The moon grows bigger and then shrinks back. After the half moon comes the dark moon."],
["s","A square is cut in half from corner to corner. What shape are the two pieces?",["triangles","circles","rectangles","hexagons"],0,"Cutting a square corner to corner makes 2 triangles."],
["s","What comes next?\n🕐 🕑 🕒 🕓 ?",["🕔","🕕","🕐","🕖"],0,"The clock goes up by 1 hour each time. After 4 o'clock comes 5 o'clock."]
];
const lab={v:"Word puzzles",n:"Number puzzles",s:"Pattern puzzles"};
const app=document.getElementById("app");
let S=null,tm=0,rs=false;
let D={st:{v:[0,0],n:[0,0],s:[0,0]},days:[],stars:0};
try{const r=localStorage.getItem("pp1");if(r)D=Object.assign(D,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("pp1",JSON.stringify(D))}catch(e){}}
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(r){const idx=r[2][0].startsWith("The ")?[0,1,2,3]:sh([0,1,2,3]);return{t:r[0],q:r[1],o:idx.map(i=>r[2][i]),a:idx.indexOf(r[3]),e:r[4]}}
function streak(){let n=0,d=new Date();const has=x=>D.days.includes(x.toLocaleDateString("en-CA"));if(!has(d))d.setDate(d.getDate()-1);while(has(d)){n++;d.setDate(d.getDate()-1)}return n}
function home(){clearInterval(tm);rs=false;const k=streak();
app.innerHTML=`<h1>Puzzle Practice</h1><p class="sub">A few minutes a day. Pick a puzzle type to start.</p><div class="badges"><span>${k?"🔥 "+k+"-day streak":"🔥 Start a streak today"}</span><span>⭐ ${D.stars} stars</span></div><div class="menu"><button class="m" data-a="start" data-v="v"><b>Word puzzles</b><small>Analogies and odd one out</small></button><button class="m" data-a="start" data-v="n"><b>Number puzzles</b><small>Patterns and number sense</small></button><button class="m" data-a="start" data-v="s"><b>Pattern puzzles</b><small>Shapes and sequences</small></button><button class="m" data-a="start" data-v="mix"><b>Mixed practice</b><small>8 questions, all types</small></button><button class="m" data-a="start" data-v="mock"><b>Practice test</b><small>20 questions with a timer</small></button></div><button class="ghost" data-a="prog">Progress for parents</button>`}
function start(m){const pool=B.filter(r=>m=="mix"||m=="mock"||r[0]==m);const n=m=="mock"?20:8;
S={m,qs:sh(pool).slice(0,n).map(mk),i:0,r:0,miss:[],t0:Date.now(),sel:null};clearInterval(tm);rq();if(m=="mock")tm=setInterval(clock,1000)}
function clock(){const c=document.getElementById("clk");if(c){const s=Math.floor((Date.now()-S.t0)/1000);c.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}}
function rq(){const q=S.qs[S.i],parts=q.q.split("\n"),p=parts[0],sq=parts[1];
app.innerHTML=`<div class="top"><button class="ghost" data-a="home">Home</button><span>Question ${S.i+1} of ${S.qs.length}</span>${S.m=="mock"?'<span id="clk">0:00</span>':""}</div><div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div><div class="card"><p class="q">${p}</p>${sq?`<p class="seq">${sq}</p>`:""}</div><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-a="pick" data-v="${i}">${o}</button>`).join("")}</div><div id="fb"></div>`;clock()}
function pick(i){if(S.sel!==null)return;i=+i;S.sel=i;const q=S.qs[S.i],ok=i===q.a,btns=document.querySelectorAll(".opt");
D.st[q.t][0]++;if(ok){D.st[q.t][1]++;S.r++}else S.miss.push(q);save();
if(S.m=="mock"){btns[i].classList.add("pick");setTimeout(next,250);return}
btns.forEach((b,j)=>{if(j===q.a)b.classList.add("ok");else if(j===i)b.classList.add("no")});
const last=S.i==S.qs.length-1;
document.getElementById("fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><b>${ok?"Nice!":"Not quite."}</b> ${ok?"":"The answer is "+q.o[q.a]+". "}${q.e}</div><button class="go" data-a="next">${last?"See results":"Next question"}</button>`}
function next(){S.i++;S.sel=null;if(S.i>=S.qs.length)fin();else rq()}
function fin(){clearInterval(tm);const n=S.qs.length,pc=S.r/n,d=new Date().toLocaleDateString("en-CA");
D.stars+=S.r;if(!D.days.includes(d))D.days.push(d);save();const s=Math.round((Date.now()-S.t0)/1000);
const msg=pc>=.8?"Great work!":pc>=.5?"Good effort. Keep going!":"Tricky set. Every puzzle you try helps.";
const rev=S.miss.map(q=>{const pr=q.q.split("\n");return `<div class="card rev"><p>${pr[0]}</p>${pr[1]?`<p class="seq">${pr[1]}</p>`:""}<p><b>Answer: ${q.o[q.a]}.</b> ${q.e}</p></div>`}).join("");
app.innerHTML=`<h1>${S.r} of ${n} correct</h1><p class="sub">${msg} You earned ${S.r} ⭐.${S.m=="mock"?" Time: "+Math.floor(s/60)+" min "+(s%60)+" sec.":""}</p><div class="menu"><button class="m" data-a="start" data-v="${S.m}"><b>Practice again</b></button><button class="m" data-a="home"><b>Home</b></button></div>${S.miss.length?"<h2>Let's look at these again</h2>"+rev:""}`}
function prog(){const bars=Object.keys(lab).map(k=>{const a=D.st[k][0],c=D.st[k][1],p=a?Math.round(c/a*100):0;return `<div class="card"><b>${lab[k]}</b><p class="sub">${a?c+" of "+a+" correct ("+p+"%)":"Not tried yet"}</p><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("");
app.innerHTML=`<div class="top"><button class="ghost" data-a="home">Home</button></div><h1>Progress</h1><p class="sub">Lower scores show which puzzle types to practise more. Scores are saved on this iPad only.</p>${bars}<p class="sub">Days practised: ${D.days.length}. Stars: ${D.stars}.</p><button class="ghost" data-a="reset">${rs?"Tap again to erase everything":"Reset progress"}</button>`}
function reset(){if(!rs){rs=true;prog();return}D={st:{v:[0,0],n:[0,0],s:[0,0]},days:[],stars:0};save();rs=false;home()}
const acts={start,pick,next,home,prog,reset};
app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)acts[b.dataset.a](b.dataset.v)});
home();
</script>
</body>
</html>
