<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Puzzle Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF3FF;--card:#FFFFFF;--ink:#1F2A44;--mute:#56627F;--ok:#1E8E5A;--okbg:#DFF5E8;--no:#C2410C;--nobg:#FFE9DD;--line:#C9D8F0;--brand:#3B6FE0;--on-brand:#FFFFFF;--sel:#E3ECFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141B2D;--card:#1E2842;--ink:#EEF2FF;--mute:#A6B1CF;--ok:#6FE0A4;--okbg:#17382B;--no:#FFB38A;--nobg:#3A2518;--line:#33406A;--brand:#7FA2FF;--on-brand:#141B2D;--sel:#27345A}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 19px/1.5 Nunito,"Trebuchet MS",system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:860px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px max(56px,env(safe-area-inset-bottom))}
h1,h2,.q,.seq,.go,.tile b,.clk{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif}
h1{font-size:38px;line-height:1.1;margin:8px 0}
h2{font-size:25px;margin:26px 0 10px}
p{margin:6px 0}
.sub{color:var(--mute);margin:4px 0 14px}
.mute,small{color:var(--mute)}
small{display:block;font-size:15px;line-height:1.3}
.good{color:var(--ok)}
.badges{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.badges span{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.row{display:flex;gap:12px;margin:16px 0}.row>button{flex:1}
.menu{display:grid;gap:12px;margin:16px 0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.45}
.ghost{background:none;border:2px solid var(--line);border-radius:14px;padding:10px 18px;min-height:50px}
.ghost.wide{width:100%}
.go{background:var(--brand);color:var(--on-brand);border:0;border-radius:16px;font-size:24px;font-weight:700;padding:16px 24px;min-height:64px;width:100%;margin-top:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 22px;margin:12px 0}
.card.main{border-color:var(--brand)}
.card.main .go{margin-top:8px}
.card.scroll{overflow-x:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 18px;min-height:84px}
.tile.wide{margin:10px 0}
.tile b{font-size:21px;font-weight:700;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lc{font-size:14px;font-weight:800;border-radius:999px;padding:2px 10px;border:2px solid var(--line);color:var(--mute)}
.lc.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.lc.open{border-color:var(--brand);color:var(--brand)}
.lvh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lvh b{font-size:22px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 8px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.q{font-size:25px;line-height:1.3;font-weight:700;margin:0 0 6px}
.seq{font-size:36px;line-height:1.4;font-weight:700;margin:8px 0 0;letter-spacing:.04em;overflow-wrap:anywhere}
.seq.sent{font-size:28px;letter-spacing:0;font-family:Nunito,system-ui,sans-serif;font-weight:800}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--brand);text-align:center;color:var(--brand)}
svg.matrix{display:block;width:min(330px,100%);margin:10px auto 0}
svg.trio{display:block;width:min(360px,100%);margin:10px auto 0}
svg.pfsteps{display:block;width:100%;max-width:520px;margin:10px auto 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.opts.sv{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.opt{min-height:70px;font-size:26px;font-weight:800;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 12px;text-align:center;position:relative}
.opt .ltr{font-size:15px;color:var(--mute);margin-right:8px}
.opts.sv .opt{padding:8px}
.opts.sv .ltr{display:block;margin:0 0 4px;text-align:left}
.opt .fig{display:block;width:100%;max-width:130px;margin:0 auto;background:#fff;border-radius:12px}
.opt.sel{border-color:var(--brand);background:var(--sel)}
.opt.ok{background:var(--okbg);border-color:var(--ok);opacity:1}
.opt.no{background:var(--nobg);border-color:var(--no);opacity:1}
.opt:disabled{opacity:1}
.fb{border-radius:16px;padding:14px 18px;margin:14px 0 6px;background:var(--card);border:2px solid var(--line);border-left-width:8px}
.fb.good{border-left-color:var(--ok);color:var(--ink)}
.fb.bad{border-left-color:var(--no)}
.cns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.cn{width:50px;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;padding:2px}
.cn.got{background:var(--sel);border-color:var(--brand)}
.cn.here{outline:4px solid var(--brand);outline-offset:1px}
.cn.r{background:var(--okbg);border-color:var(--ok)}
.cn.w{background:var(--nobg);border-color:var(--no)}
.cn small{font-size:12px;line-height:1;margin-top:1px}
.rvq{margin-top:10px;border-top:2px dashed var(--line);padding-top:10px}
.clk{font-size:30px;font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:2px 14px}
.clk.low{color:var(--no);border-color:var(--no)}
.tbl{width:100%;border-collapse:collapse;font-size:17px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:15px;color:var(--mute)}
:focus-visible{outline:4px solid var(--brand);outline-offset:3px}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.puck{font-size:54px;line-height:1;background:var(--card);border:3px solid var(--brand);border-radius:50%;width:84px;height:84px;display:grid;place-items:center;flex:none}
.hero h1{margin:0}.hero .sub{margin:2px 0 0}
.note{background:var(--sel);border-radius:14px;padding:8px 14px;margin:10px 0;font-weight:800;font-size:17px}
.tile.part .lvh{align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.stat b{font:700 28px/1.1 Fredoka,system-ui,sans-serif;display:block}
.dchart{display:flex;align-items:flex-end;gap:8px;height:150px;margin:6px 0 4px}
.dcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.dbar{width:100%;max-width:46px;flex:1;display:flex;align-items:flex-end;background:var(--sel);border-radius:8px;overflow:hidden}
.dbar i{display:block;width:100%;background:var(--brand);min-height:2px}
.dval{font-size:13px;color:var(--mute);height:18px}.dlbl{font-size:13px;color:var(--mute)}
.weak{margin:0;padding-left:22px}.weak li{margin:6px 0}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti span{position:absolute;top:-40px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.pill{display:inline-block;background:var(--brand);color:var(--on-brand);border-radius:999px;padding:0 9px;font-size:15px;font-weight:800;margin-left:4px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tab{flex:1;min-width:120px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:48px;font-weight:800}
.tab.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;min-height:42px;font-size:20px}
.chip.on{border-color:var(--brand);background:var(--sel)}
.tile.miss{margin:8px 0}.tile.miss.got{opacity:.8}
.tname{width:100%;font:700 22px Fredoka,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:4px 0 10px}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 8px 8px;text-align:center;min-width:0}
.pc b{font:700 17px/1.15 Fredoka,system-ui,sans-serif}
.pc .jersey{width:64px;height:64px}
.pc .pos{position:absolute;top:6px;left:6px;font-size:13px;font-weight:800;background:var(--sel);border-radius:8px;padding:0 7px}
.pc .rt{position:absolute;top:6px;right:6px;font:700 20px Fredoka,system-ui,sans-serif}
.pc.t-rare{border-color:#3B6FE0}.pc.t-epic{border-color:#8E44D6;background:linear-gradient(160deg,var(--card),rgba(142,68,214,.16))}
.pc.t-legend{border-color:#E0A800;background:linear-gradient(160deg,var(--card),rgba(240,185,11,.3));box-shadow:0 0 14px rgba(240,185,11,.55)}
.pc.mini b{font-size:14px}.pc.mini .jersey{width:48px;height:48px}.pc.mini{padding:8px 4px 6px}
.pc.empty{border-style:dashed;min-height:96px;justify-content:center;color:var(--mute);font-weight:800}
.lineup{background:linear-gradient(180deg,rgba(120,170,255,.22),rgba(120,170,255,.08));border:3px solid var(--line);border-radius:22px;padding:12px;margin:12px 0}
.lrow{display:flex;justify-content:center;gap:10px;margin:8px 0}.slot{flex:1;max-width:210px;min-width:0}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:12px 0}
.offer{display:flex;flex-direction:column;gap:6px}.offer .go{margin-top:2px;min-height:54px;font-size:21px}
.reveal{max-width:260px;margin:14px auto}.reveal .pc b{font-size:22px}.reveal .jersey{width:96px;height:96px}
.goalbox{position:relative;height:200px;margin:12px 0;border-radius:18px;border:6px solid #C8102E;border-bottom:0;border-radius:18px 18px 0 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.65) 0 2px,transparent 2px 18px),repeating-linear-gradient(0deg,rgba(255,255,255,.65) 0 2px,transparent 2px 18px),#9fc4ee;overflow:hidden}
.goalbox:after{content:'';position:absolute;left:0;right:0;bottom:0;height:14px;background:#e9f2ff;border-top:3px solid #9bb4d8}
.gk{position:absolute;bottom:10px;z-index:1;left:50%;transform:translateX(-50%);font-size:60px;transition:left .35s ease-out}
.aim{position:absolute;top:34%;left:50%;transform:translateX(-50%);font-size:46px}
.shotmsg{min-height:34px;font:700 22px Fredoka,system-ui,sans-serif;text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px auto;max-width:460px}
.mc{aspect-ratio:1;font-size:40px;background:var(--card);border:3px solid var(--line);border-radius:16px}
.mc.up{background:var(--sel);border-color:var(--brand)}.mc.ok{background:var(--okbg);border-color:var(--ok)}
.go small{display:block;font:600 15px Nunito,system-ui,sans-serif;opacity:.9}
@media (max-width:560px){h1{font-size:31px}.seq{font-size:30px}.q{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script src="js/core.js?v=6"></script>
<script src="js/gen-quant.js?v=6"></script>
<script src="js/gen-verbal.js?v=6"></script>
<script src="js/data-sc-e.js?v=6"></script>
<script src="js/data-sc-a.js?v=6"></script>
<script src="js/data-sc-c.js?v=6"></script>
<script src="js/figures.js?v=6"></script>
<script src="js/gen-figure.js?v=6"></script>
<script src="js/gen-fold.js?v=6"></script>
<script src="js/data-nhl.js?v=6"></script>
<script src="js/app-state.js?v=6"></script>
<script src="js/app-ui.js?v=6"></script>
<script src="js/app-fun.js?v=6"></script>
<script>PP.home();PP.warm();</script>
</body>
</html>
